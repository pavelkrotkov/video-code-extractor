name: Dependabot Auto-Merge

# Sweeper: squash-merges open Dependabot PRs once every check is green.
# Runs on a schedule instead of pull_request_target so it never executes
# untrusted PR code, and so transient failures are retried on the next pass.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  merge-passing-dependabot-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # squash-merge Dependabot PRs and delete their branches
      pull-requests: write # read check status on PRs
    steps:
      - name: Merge passing Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pr_numbers="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number \
            --jq '.[].number')"

          if [ -z "$pr_numbers" ]; then
            echo "No open Dependabot PRs."
            exit 0
          fi

          for pr_number in $pr_numbers; do
            echo "Evaluating PR #$pr_number"
            if gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/checks-$pr_number.txt" 2>&1; then
              cat "$RUNNER_TEMP/checks-$pr_number.txt"
              echo "All checks passed; squash-merging PR #$pr_number"
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" \
                --squash \
                --delete-branch \
                --subject "$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json title --jq .title)"
            else
              cat "$RUNNER_TEMP/checks-$pr_number.txt"
              echo "Checks pending or failing; skipping PR #$pr_number"
            fi
          done
